<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e1e4e8; padding: 24px; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  h1 { font-size: 24px; margin-bottom: 4px; color: #58a6ff; }
  .subtitle { color: #8b949e; font-size: 14px; }
  .strategy-badge { display: inline-block; background: #1f2937; border: 1px solid #30363d; border-radius: 6px; padding: 4px 12px; font-size: 13px; color: #79c0ff; margin-bottom: 20px; }
  .auth-box { text-align: right; font-size: 12px; color: #8b949e; }
  .auth-box button { background: #1f2937; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .auth-box button:hover { border-color: #58a6ff; }
  .auth-state { margin-bottom: 6px; }
  .auth-ok { color: #3fb950; }
  .auth-missing { color: #d29922; }
  /* Aggregate stats bar */
  .statsbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .metric { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px 16px; }
  .metric-value { font-size: 26px; font-weight: 700; color: #c9d1d9; }
  .metric-value.warn { color: #d29922; }
  .metric-value.bad { color: #f85149; }
  .metric-label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .card-name { font-size: 16px; font-weight: 600; }
  .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-healthy { background: #0d3520; color: #3fb950; }
  .badge-unhealthy { background: #3d1214; color: #f85149; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
  .stat { text-align: center; }
  .stat-value { font-size: 22px; font-weight: 700; color: #c9d1d9; }
  .stat-label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .meta { margin-top: 12px; font-size: 12px; color: #8b949e; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .meta span { background: #1f2937; padding: 2px 8px; border-radius: 4px; }
  /* Telemetry bars */
  .telem { margin-top: 12px; display: grid; gap: 8px; }
  .telem-row { display: grid; grid-template-columns: 70px 1fr 56px; align-items: center; gap: 8px; font-size: 11px; color: #8b949e; }
  .bar { height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; background: #3fb950; transition: width 0.4s; }
  .bar-fill.warn { background: #d29922; }
  .bar-fill.bad { background: #f85149; }
  .telem-num { text-align: right; color: #c9d1d9; }
  .logs { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; }
  .logs h2 { font-size: 16px; margin-bottom: 12px; color: #c9d1d9; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 10px; border-bottom: 1px solid #30363d; color: #8b949e; font-weight: 500; }
  td { padding: 6px 10px; border-bottom: 1px solid #21262d; }
  .status-200 { color: #3fb950; }
  .status-429 { color: #d29922; }
  .status-499, .status-502, .status-503 { color: #f85149; }
  .stream-true { color: #d2a8ff; }
  .muted { color: #6e7681; }
  .updated { color: #8b949e; font-size: 12px; text-align: right; margin-top: 12px; }
  .banner { background: #3d1214; color: #f85149; border: 1px solid #f85149; border-radius: 8px; padding: 12px 16px; margin-bottom: 18px; display: none; }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>Meridian</h1>
      <p class="subtitle">Inference Gateway Dashboard</p>
    </div>
    <div class="auth-box">
      <div class="auth-state" id="auth-state"></div>
      <button id="auth-btn" onclick="setKey()">Set API key</button>
      <button id="signout-btn" onclick="clearKey()" style="display:none;">Sign out</button>
    </div>
  </div>

  <div class="banner" id="banner"></div>
  <div id="strategy" class="strategy-badge">Loading...</div>

  <div class="statsbar" id="statsbar"></div>
  <div id="backends" class="grid"></div>

  <div class="logs">
    <h2>Recent Requests</h2>
    <table>
      <thead><tr>
        <th>Request ID</th><th>Backend</th><th>Model</th><th>Org</th><th>Team</th>
        <th>Tier</th><th>Stream</th><th>Status</th><th>Latency</th><th>Time</th>
      </tr></thead>
      <tbody id="log-body"></tbody>
    </table>
  </div>
  <p class="updated" id="updated"></p>

<script>
const KEY_STORE = 'meridian_api_key';

function getKey() { return localStorage.getItem(KEY_STORE) || ''; }

function setKey() {
  const cur = getKey();
  const k = prompt('Enter a Meridian API key (Bearer). Needs a role/viewer or admin key when auth is on:', cur);
  if (k !== null) { localStorage.setItem(KEY_STORE, k.trim()); renderAuthState(); poll(); }
}

function clearKey() { localStorage.removeItem(KEY_STORE); renderAuthState(); poll(); }

function renderAuthState() {
  const el = document.getElementById('auth-state');
  const signout = document.getElementById('signout-btn');
  if (getKey()) {
    el.innerHTML = '<span class="auth-ok">&#9679; key set</span>';
    signout.style.display = 'inline-block';
  } else {
    el.innerHTML = '<span class="auth-missing">&#9679; no key (open mode)</span>';
    signout.style.display = 'none';
  }
}

function authHeaders() {
  const k = getKey();
  return k ? { 'Authorization': 'Bearer ' + k } : {};
}

function showBanner(msg) {
  const b = document.getElementById('banner');
  b.textContent = msg;
  b.style.display = msg ? 'block' : 'none';
}

function pct(v) { return Math.max(0, Math.min(100, v)); }
function barClass(p) { return p >= 85 ? 'bad' : p >= 60 ? 'warn' : ''; }

function telemetryRows(b) {
  const rows = [];
  if (b.queue_depth != null) {
    const p = pct(b.queue_depth * 10); // heuristic scale for display
    rows.push(`<div class="telem-row"><span>queue</span><div class="bar"><div class="bar-fill ${barClass(p)}" style="width:${p}%"></div></div><span class="telem-num">${b.queue_depth}</span></div>`);
  }
  if (b.gpu_mem_util != null) {
    const p = pct(b.gpu_mem_util * 100);
    rows.push(`<div class="telem-row"><span>gpu mem</span><div class="bar"><div class="bar-fill ${barClass(p)}" style="width:${p}%"></div></div><span class="telem-num">${p.toFixed(0)}%</span></div>`);
  }
  if (b.tokens_per_sec != null) {
    rows.push(`<div class="telem-row"><span>tok/s</span><div class="bar"><div class="bar-fill" style="width:100%"></div></div><span class="telem-num">${b.tokens_per_sec.toFixed(0)}</span></div>`);
  }
  return rows.length ? `<div class="telem">${rows.join('')}</div>` : '';
}

function renderBackends(data) {
  const el = document.getElementById('backends');
  document.getElementById('strategy').textContent = 'Strategy: ' + data.strategy;
  el.innerHTML = data.backends.map(b => `
    <div class="card">
      <div class="card-header">
        <span class="card-name">${b.name}</span>
        <span class="badge ${b.healthy ? 'badge-healthy' : 'badge-unhealthy'}">${b.healthy ? 'Healthy' : 'Unhealthy'}</span>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-value">${b.inflight}</div><div class="stat-label">Inflight</div></div>
        <div class="stat"><div class="stat-value">${(b.inflight_cost ?? 0).toFixed(0)}</div><div class="stat-label">Cost Inflight</div></div>
        <div class="stat"><div class="stat-value">${b.ewma_latency_ms.toFixed(1)}</div><div class="stat-label">EWMA ms</div></div>
        <div class="stat"><div class="stat-value">${b.weight}</div><div class="stat-label">Weight</div></div>
      </div>
      <div class="meta">
        <span>${b.engine}</span>
        ${b.model ? '<span>' + b.model + '</span>' : ''}
        ${b.tags.map(t => '<span>' + t + '</span>').join('')}
        <span>${b.url}</span>
      </div>
      ${telemetryRows(b)}
    </div>
  `).join('');
}

function percentile(sorted, p) {
  if (!sorted.length) return 0;
  const idx = Math.min(sorted.length - 1, Math.floor((p / 100) * sorted.length));
  return sorted[idx];
}

function renderStats(records, statusData) {
  const total = records.length;
  const errors = records.filter(r => r.status_code >= 400).length;
  const errRate = total ? (errors / total) * 100 : 0;
  const lat = records.map(r => r.latency_ms).sort((a, b) => a - b);
  const p50 = percentile(lat, 50);
  const p95 = percentile(lat, 95);
  const healthy = (statusData.backends || []).filter(b => b.healthy).length;
  const totalB = (statusData.backends || []).length;

  const errClass = errRate >= 10 ? 'bad' : errRate >= 1 ? 'warn' : '';
  const healthClass = healthy < totalB ? 'bad' : '';

  document.getElementById('statsbar').innerHTML = `
    <div class="metric"><div class="metric-value">${total}</div><div class="metric-label">Recent Reqs</div></div>
    <div class="metric"><div class="metric-value ${errClass}">${errRate.toFixed(1)}%</div><div class="metric-label">Error Rate</div></div>
    <div class="metric"><div class="metric-value">${p50.toFixed(0)}ms</div><div class="metric-label">p50 Latency</div></div>
    <div class="metric"><div class="metric-value">${p95.toFixed(0)}ms</div><div class="metric-label">p95 Latency</div></div>
    <div class="metric"><div class="metric-value ${healthClass}">${healthy}/${totalB}</div><div class="metric-label">Backends Up</div></div>
  `;
}

function renderRequests(records) {
  const tbody = document.getElementById('log-body');
  tbody.innerHTML = records.map(r => `
    <tr>
      <td>${r.request_id || '-'}</td>
      <td>${r.chosen_backend}</td>
      <td>${r.model}</td>
      <td class="${r.org_id ? '' : 'muted'}">${r.org_id || '-'}</td>
      <td class="${r.team_id ? '' : 'muted'}">${r.team_id || '-'}</td>
      <td class="${r.tier ? '' : 'muted'}">${r.tier || '-'}</td>
      <td class="${r.stream ? 'stream-true' : ''}">${r.stream}</td>
      <td class="status-${r.status_code}">${r.status_code}</td>
      <td>${r.latency_ms.toFixed(1)}ms</td>
      <td>${new Date(r.timestamp).toLocaleTimeString()}</td>
    </tr>
  `).join('');
}

async function poll() {
  try {
    const opts = { headers: authHeaders() };
    const [statusResp, reqResp] = await Promise.all([
      fetch('/meridian/status', opts),
      fetch('/meridian/requests', opts),
    ]);

    if (statusResp.status === 401 || reqResp.status === 401) {
      showBanner('Authentication required — set an API key (auth is enabled on this gateway).');
      return;
    }
    if (statusResp.status === 403 || reqResp.status === 403) {
      showBanner('This key is not permitted to view operator data. Use a viewer/operator/admin key.');
      return;
    }
    showBanner('');

    const statusData = await statusResp.json();
    const reqData = await reqResp.json();
    const records = reqData.requests || [];
    renderStats(records, statusData);
    renderBackends(statusData);
    renderRequests(records);
    document.getElementById('updated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
  } catch (e) {
    showBanner('Poll error: ' + e.message);
    console.error('Poll error:', e);
  }
}

renderAuthState();
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
