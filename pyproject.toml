[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridian"
version = "0.10.0"
description = "On-soil AI inference gateway for Indian enterprises"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "httpx",
    "pydantic>=2.0",
    "pydantic-settings",
    "pyyaml",
    "prometheus-client",
    "cryptography",
]

[project.optional-dependencies]
audit = [
    "aiokafka",
    "boto3",
]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "types-PyYAML",
    "rich",
    # Audit extras included so the full test suite (publisher/consumer paths)
    # keeps working on a plain `[dev]` install.
    "aiokafka",
    "boto3",
]

[project.scripts]
meridian = "meridian.cli.main:cli"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
# Newer mypy no longer supports targeting 3.9. Ruff's py39 target keeps the code
# 3.9-compatible at the syntax level; mypy checks against 3.10 semantics.
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
