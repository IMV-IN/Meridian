name: control-plane

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Check out meridian-node so the cross-repo tests exercise the real
      # node <-> control connection (the compatibility target) in CI.
      - name: Checkout meridian-node
        uses: actions/checkout@v4
        with:
          repository: IMV-IN/meridian-node
          path: meridian-node

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install control + node agent
        run: |
          pip install -e ".[control,dev]"
          pip install -e ./meridian-node[http]

      - name: Lint + type-check control
        run: |
          ruff check meridian_control tests/control
          mypy meridian_control

      - name: Test control + cross-repo connection
        run: pytest tests/control -q

      - name: Connection numbers report
        run: python scripts/verify_connection.py
