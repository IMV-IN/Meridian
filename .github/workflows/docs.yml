name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install MkDocs Material
        run: pip install "mkdocs-material>=9.5,<10"
      # The control plane serves this build at /docs/ (see docs/CLOUD.md); nothing is deployed from here.
      - name: Build documentation
        run: mkdocs build --strict
      - name: Internal docs stay out of the site
        run: test ! -e site/internal && test ! -e site/scans && test ! -e site/superpowers
